[project]
name = "taller-evaluator"
version = "0.1.0"
description = "Stateless evaluation service for drawing submissions"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "anthropic>=0.40.0",
    "pillow>=10.0.0",
    "tenacity>=8.5.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
