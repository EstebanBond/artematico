server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Usado por el healthcheck del compose: responde 200 aunque apps/web/dist
    # todavía esté vacío (antes de la rebanada 10).
    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # Proxy same-origin hacia el bff (rebanada 10). El PWA y el bff quedan bajo
    # el mismo origen (taller.sikno.com.mx) desde la perspectiva del navegador,
    # así la cookie de sesión del PIN funciona con sameSite=lax normal, sin
    # necesitar sameSite=None/Secure ni configuración especial de CORS
    # cross-subdominio entre taller.sikno.com.mx y api-taller.sikno.com.mx.
    location /graphql {
        proxy_pass http://bff:4000/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /upload {
        client_max_body_size 12M; # coincide con el límite de tamaño del bff
        proxy_pass http://bff:4000/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://bff:4000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rebanada 13: descarga del PDF del paquete de impresión (puede tardar
    # unos segundos en generarse — se transmite en streaming, no se guarda
    # en disco en ningún lado).
    location /print-package {
        proxy_pass http://bff:4000/print-package;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
